<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Vault Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 53, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 800; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-admin { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .badge-vip { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .badge-user { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .btn { display: block; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; border: none; margin-top: 8px; }
    .btn-primary { background: var(--accent-grad); color: #fff; }
    .btn-gold { background: var(--gold-grad); color: #fff; }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid var(--danger); }
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 12px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; margin: 10px 0; }
    .stat-item span { color: var(--text-muted); display: block; font-size: 10px; text-transform: uppercase; }
    .stat-item b { font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FILE VAULT DASHBOARD</h1>
    <p>Admin: @MRINFERNAL</p>
  </div>
  <div class="badge-bar">
    <span id="roleBadge" class="badge">Loading...</span>
    <span id="userTag" style="font-size: 12px; color: var(--text-muted);"></span>
  </div>
  <div id="mainContainer">
    <div class="card" style="text-align:center; padding: 20px;">
      <p style="font-size:14px; margin-bottom: 8px;">🚀 <b>Dashboard Active</b></p>
      <p style="font-size:12px; color:var(--text-muted);">Use the options below to manage your vault or create links directly inside @FILETOLINKSPRBOT.</p>
      <button onclick="tgAction('start_upload')" class="btn btn-primary" style="margin-top:14px;">📤 Create New Link</button>
      <button onclick="tgAction('myfiles')" class="btn btn-gold">📋 View My Saved Links</button>
      <button onclick="tgAction('plans')" class="btn btn-primary" style="background:#22c55e;">💎 Upgrade Plans</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const ADMIN_ID = 5227795354;
    const user = tg?.initDataUnsafe?.user || { id: ADMIN_ID, first_name: "MRINFERNAL", username: "MRINFERNAL" };
    const isAdmin = (Number(user.id) === ADMIN_ID);

    const roleBadge = document.getElementById("roleBadge");
    const userTag = document.getElementById("userTag");

    userTag.innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;

    if (isAdmin) {
      roleBadge.innerText = "👑 Master Admin";
      roleBadge.className = "badge badge-admin";
    } else {
      roleBadge.innerText = "Active User";
      roleBadge.className = "badge badge-user";
    }

    function tgAction(command) {
      if (tg) {
        tg.sendData(JSON.stringify({ action: command }));
        tg.close();
      } else {
        window.open("https://t.me/FILETOLINKSPRBOT", "_blank");
      }
    }
  </script>
</body>
</html>
